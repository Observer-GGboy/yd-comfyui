[project]
name = "DirectorMV_Nodes"
version = "0.1.0"
description = "MV Director System - ComfyUI nodes for realistic MV generation with identity preservation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "DirectorMV Team"}
]
keywords = ["comfyui", "mv", "video", "generation", "identity", "lipsync"]

dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
voice = [
    "fish-audio-sdk>=0.1.0",
    "elevenlabs>=0.2.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]

